name: gt4sd
channels:
  - https://conda.anaconda.org/pytorch
  - https://conda.anaconda.org/nvidia
  - https://conda.anaconda.org/pyg
  - https://conda.anaconda.org/conda-forge
dependencies:
  - setuptools==78.1.1  # CVE-2025-47273 (path traversal). CVE-2026-59890 needs >=83 but 82+ drops pkg_resources (breaks accelerate<0.20 + 15 deps) - blocked.
  - python>=3.7,<3.11
  - pip=24.0
  - pytorch>=1.0,<=1.12.1
  # PyTorch 1.12 requires iJIT_NotifyEvent, which MKL 2024.1+ removed.
  - mkl<2024.1
  - cpuonly
  - pytorch-scatter<=2.0.9
  - pip:
      - -r requirements.txt
      - -r cpu_requirements.txt
      - -r vcs_requirements.txt
      # development
      - -r dev_requirements.txt
